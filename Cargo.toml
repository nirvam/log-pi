[package]
name = "log-pi"
version = "0.2.0"
edition = "2021"
authors = ["nirvam"]
description = "System One Decision Engine in Rust - 100% TypeSafe Jev Wire Protocol Compatible"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4"] }
minijinja = { version = "2.7", features = ["macros"] }
indexmap = { version = "2.6", features = ["serde"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

[build-dependencies]
pkg-config = "0.3"
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
